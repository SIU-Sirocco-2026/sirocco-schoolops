openapi: 3.1.0
info:
  title: Sirocco SchoolOps API
  version: 0.1.0-rc.2
  description: Foundation, G01/G02/G03, evidence, versioned packs and scoped reports. All non-public endpoints verify JWT and current database membership. Local demo only; APISIX enforces 300 requests per minute per client IP. HTTP 429 includes X-RateLimit-Reset in seconds and may have an HTML body; clients must not assume every error is JSON.
servers:
  - url: http://localhost:8088
security:
  - bearerAuth: []
paths:
  /api/health/live:
    get:
      security: []
      responses:
        "200": { description: API process is running }
  /api/health/ready:
    get:
      security: []
      responses:
        "200":
          {
            description: "Database, Identity and deployed workflow are reachable",
          }
        "503": { description: Dependencies are starting or unavailable }
  /api/config:
    get:
      security: []
      responses:
        "200":
          description: Public OIDC client configuration and source/version metadata without secrets
          content:
            application/json:
              schema:
                type: object
                required: [auth, phase, version, sourceRevision]
                properties:
                  auth:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      realm: { type: string, example: sirocco }
                      clientId: { type: string, example: schoolops-web }
                  phase: { type: integer, example: 7 }
                  version: { type: string, example: 0.1.0-rc.1 }
                  sourceRevision:
                    {
                      type: string,
                      description: Git commit SHA; development builds may append -dirty or use unknown,
                    }
  /api/me:
    get:
      responses:
        "200": { description: Current identity and database roles }
        "401": { description: Missing or invalid access token }
        "403": { description: Membership missing or disabled }
  /api/foundation/tasks:
    get:
      responses:
        "200":
          {
            description: "Tasks created by or assigned to current user, most recent 100",
          }
        "401": { description: Missing or invalid access token }
        "403": { description: Membership missing or disabled }
    post:
      description: Reporter/coordinator only. Assignee is the configured demo technician. No automatic retry on uncertain engine result.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 5, maxLength: 160 }
      responses:
        "201": { description: Persisted run linked to real engine process }
        "200": { description: Existing result for identical idempotent request }
        "202":
          {
            description: Starting or uncertain result preserved for reconciliation,
          }
        "400": { description: Invalid title or idempotency key }
        "401": { description: Invalid authentication }
        "403": { description: Wrong role or disabled membership }
        "409":
          {
            description: Same key with different request or unavailable assignee,
          }
        "503": { description: Engine not ready or storage unavailable }
  /api/foundation/tasks/{id}/complete:
    post:
      description: Only the currently authorized assigned technician may complete. Repeated completion returns the stored result.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          { description: Engine history confirms end and result is persisted }
        "400": { description: Invalid ID }
        "401": { description: Invalid authentication }
        "403": { description: Wrong assignee or role }
        "404": { description: Run missing or not visible to caller }
        "409": { description: State or engine mapping conflict }
        "503":
          {
            description: Dependency unavailable or result uncertain; check status before retrying,
          }
  /api/g01/catalog:
    get:
      responses:
        "200":
          {
            description: "Rooms, room-bound assets, enabled staff by roles, eligible teams and pinned versions. No secrets.",
          }
        "401": { description: Missing or invalid token }
        "403": { description: Disabled membership }
  /api/g01/cases:
    get:
      description: Only cases involving the caller in their current role or an eligible unclaimed team task. Technical admin has no implicit access.
      parameters:
        - in: query
          name: bucket
          schema:
            {
              type: string,
              enum: [all, open, overdue, completed],
              default: all,
            }
          description: Report drill-down using exactly the same current-role case scope
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/CaseStatus" },
          }
        - {
            in: query,
            name: q,
            schema: { type: string, maxLength: 160 },
            description: Case-insensitive literal search in code/title/description,
          }
        - {
            in: query,
            name: mine,
            schema: { type: boolean },
            description: Only cases with an available action for this user,
          }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
      responses:
        "200":
          description: Filtered page, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Case" },
                    }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer, const: 25 }
        "400": { description: Invalid filter or unexpected query parameter }
        "401": { description: Missing or invalid token }
        "403": { description: Disabled membership }
    post:
      description: Reporter creates a case and real verification task. Pins package/schema snapshot/workflow and exact definition ID. Replays return the same case; durable outbox and worker reconcile uncertain engine results.
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Report" }
      responses:
        "201": { $ref: "#/components/responses/CaseResult" }
        "200": { $ref: "#/components/responses/CaseResult" }
        "202":
          {
            description: Case preserved with syncStatus pending/needs_reconciliation. Worker retries and reconciles automatically; poll detail rather than creating another process.,
          }
        "400":
          {
            description: "Invalid report, room/asset relationship or idempotency key",
          }
        "401": { description: Missing or invalid token }
        "403": { description: Not reporter or membership disabled }
        "409":
          {
            description: Same key with different content or no enabled coordinator,
          }
        "503": { description: Storage/engine not ready }
  /api/g01/cases/{id}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      responses:
        "200":
          description: Authorized detail and append-only chronological timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Case" }
                  synchronization:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        action: { type: string }
                        state: { enum: [pending, blocked] }
                        attempts: { type: integer }
                        lastError: { type: [string, "null"] }
                        nextAttemptAt: { type: string, format: date-time }
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        action: { type: string }
                        actorId: { type: string, format: uuid }
                        actorName: { type: string }
                        createdAt: { type: string, format: date-time }
                        fromStatus: { type: [string, "null"] }
                        toStatus: { $ref: "#/components/schemas/CaseStatus" }
                        revision: { type: integer }
                        details:
                          {
                            type: object,
                            description: "Original description, reason, assignment/deadline or work measures/result as appropriate",
                          }
        "400": { description: Invalid UUID }
        "401": { description: Missing or invalid token }
        "403": { description: Disabled membership }
        "404": { description: Missing case or no case permission }
  /api/g01/cases/{id}/actions:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      description: Checks current role, case ownership/assignment/team, step, revision and actual engine task. Coordinator accepts/returns/assigns; reporter resubmits; technician receives/saves/submits; designated approver returns or approves and closes. Repairer cannot approve. Reasons required on both return branches. Save_work records text without completing the engine task. All objects reject extra fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, revision]
                  properties:
                    action: { enum: [accept, receive, approve] }
                    revision: { $ref: "#/components/schemas/Revision" }
                - type: object
                  additionalProperties: false
                  required: [action, revision, reason]
                  properties:
                    action: { enum: [return_info, return_work] }
                    revision: { $ref: "#/components/schemas/Revision" }
                    reason: { type: string, minLength: 5, maxLength: 2000 }
                - type: object
                  additionalProperties: false
                  required: [action, revision, title, roomId, description]
                  properties:
                    action: { const: resubmit }
                    revision: { $ref: "#/components/schemas/Revision" }
                    title: { type: string, minLength: 5, maxLength: 160 }
                    roomId: { type: string, minLength: 1, maxLength: 40 }
                    assetId:
                      { type: [string, "null"], minLength: 1, maxLength: 60 }
                    description:
                      { type: string, minLength: 10, maxLength: 4000 }
                - type: object
                  additionalProperties: false
                  required: [action, revision, approverId, dueAt]
                  description: Exactly one non-null technicianId or teamId. DueAt must be in the future; approver differs from repairer. Team must have an eligible technician other than approver.
                  properties:
                    action: { const: assign }
                    revision: { $ref: "#/components/schemas/Revision" }
                    technicianId: { type: [string, "null"], format: uuid }
                    teamId: { type: [string, "null"], maxLength: 60 }
                    approverId: { type: string, format: uuid }
                    dueAt: { type: string, format: date-time }
                - type: object
                  additionalProperties: false
                  required: [action, revision, measures, result]
                  properties:
                    action: { enum: [save_work, submit] }
                    revision: { $ref: "#/components/schemas/Revision" }
                    measures: { type: string, minLength: 5, maxLength: 4000 }
                    result: { type: string, minLength: 5, maxLength: 4000 }
      responses:
        "200": { $ref: "#/components/responses/CaseResult" }
        "202":
          {
            description: Engine outcome uncertain; case retained and actions blocked until reconciliation. Durable worker retries with backoff and reconciles by business key / exact task history.,
          }
        "400":
          {
            description: "Invalid input, missing reason/result, invalid assignee combination, past deadline or self-approval assignment",
          }
        "401": { description: Missing or invalid token }
        "403":
          {
            description: "Wrong role/person/current step, self approval or disabled membership",
          }
        "404": { description: Case missing or outside caller permissions }
        "409":
          {
            description: "EVIDENCE_REQUIRED: missing clean evidence for current repair task; stale revision, unavailable assignee/team, or engine/task mapping conflict",
          }
        "413": { description: JSON payload exceeds 64 KB }
        "503": { description: Dependency unavailable before command accepted }
  /api/g01/reports:
    get:
      description: Counts over the same current-membership and case permission scope as GET cases. Overdue means not closed and dueAt is before database now. Admin has no implicit access. Use cases?bucket=open|overdue|completed for drill-down.
      responses:
        "200":
          description: Visible case counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer, minimum: 0 }
                  overdue: { type: integer, minimum: 0 }
                  completed: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0 }
                  generatedAt: { type: string, format: date-time }
        "401": { description: Missing or invalid token }
        "403": { description: Disabled membership }
  /api/g01/cases/{id}/evidence:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      description: Authorized case files and whether current user can upload; no public object keys or signed download URLs.
      responses:
        "200":
          description: Evidence metadata including pending/clean/rejected/error, uploader, task, policy, checksum and scanner version
          content:
            application/json:
              schema:
                type: object
                properties:
                  canUpload: { type: boolean }
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Evidence" },
                    }
        "401": { description: Missing or invalid token }
        "403": { description: Disabled membership }
        "404": { description: Missing case or no current case permission }
    post:
      description: Raw binary upload. Reporter can upload while reporting/supplementing; assigned repairer while repairing. Case must be ready. PNG/JPEG/PDF/TXT signatures/extensions validated; files are quarantined until real ClamAV scan and promotion. Same case/uploader/key/content/filename returns existing evidence. Maximum 10 MiB.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-File-Name
          required: true
          schema: { type: string }
          description: Percent-encoded UTF-8 filename, no path separators or control characters; max 180 decoded characters
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          {
            description: Quarantined evidence created; inspect scanStatus before using it,
          }
        "200": { description: Idempotent replay of the existing evidence }
        "400":
          {
            description: Invalid filename/type/content/key,
            empty or malformed file,
          }
        "401": { description: Missing or invalid token }
        "403":
          { description: Disabled membership or UPLOAD_FORBIDDEN at this step }
        "404": { description: Missing case or no current case permission }
        "409":
          {
            description: Idempotency key already used for a different filename/content,
          }
        "413": { description: File exceeds 10 MiB }
        "503":
          {
            description: Object store unavailable; retry with the same key and file,
          }
  /api/g01/cases/{id}/evidence/{evidenceId}/download:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: evidenceId
        required: true
        schema: { type: string, format: uuid }
    get:
      description: Authenticated attachment; rechecks current membership/case permission, clean status, size and checksum. No-store and nosniff; no redirects to a public store.
      responses:
        "200":
          description: Original clean bytes with attachment filename
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
        "400": { description: Invalid UUID }
        "401": { description: Missing or invalid token }
        "403": { description: Membership revoked }
        "404": { description: File/case absent or outside case permission }
        "409":
          { description: FILE_NOT_CLEAN or FILE_INTEGRITY; download blocked }
        "503": { description: Object store unavailable }
  /api/packs:
    get:
      description: Technical admin only. Installed immutable revisions, active status, checksum, definition ID and latest validation/activation errors.
      responses:
        "200": { description: Revision items and audit events }
        "403": { description: PACK_ADMIN_REQUIRED or membership disabled }
  /api/packs/validate:
    post:
      description: Admin validates a complete bundle (manifest, schema, workflow XML, evidence, seed, labels). Strict supported adapter/BPMN subset; errors are recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: valid=true and canonical SHA-256 checksum }
        "400": { description: valid=false and structured error strings }
        "403": { description: PACK_ADMIN_REQUIRED }
  /api/packs/install:
    post:
      description: Admin validates and deploys a version without activating it. Same version/checksum is idempotent; changed bytes under an installed version are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          {
            description: Revision ID,
            pack ID,
            version,
            checksum and exact definition ID,
          }
        "400": { description: Invalid bundle }
        "403": { description: PACK_ADMIN_REQUIRED }
        "409": { description: IMMUTABLE_VERSION }
        "503": { description: Deploy/storage unavailable; active unchanged }
  /api/packs/{id}/{version}/activate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: version, required: true, schema: { type: string } }
    post:
      description: Admin revalidates installed bundle/checksum and definition; atomically switches active revision. Existing cases retain pinned revision/schema/policy/definition.
      responses:
        "200": { description: Activated revision }
        "403": { description: PACK_ADMIN_REQUIRED }
        "404": { description: PACK_NOT_FOUND }
        "409": { description: PACK_INTEGRITY }
        "503": { description: Dependencies unavailable; active unchanged }
  /api/g02/sources/{id}/observations:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, enum: [demo-pm25] },
        }
    post:
      description: environment_ingestor only. Stores raw/normalized/source/event/observed/received/quality/revision. Serializes by source. Valid samples evaluate versioned rule; invalid/late excluded. Same event/content replay returns existing; conflicting content cannot overwrite. Observation/episode/case/outbox commit atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [eventId, stationId, observedAt, quantity, value, unit, label]
              properties:
                eventId: { type: string, minLength: 1, maxLength: 100 }
                stationId: { const: A101-PM25 }
                observedAt: { type: string, format: date-time }
                quantity: { const: pm25 }
                value: { type: number }
                unit: { enum: [ug/m3, mg/m3] }
                label: { const: replayed }
      responses:
        "201":
          {
            description: Valid observation,
            optional episodeId/caseId; human workflow may still synchronize asynchronously,
          }
        "200": { description: duplicate=true; existing observation }
        "202":
          {
            description: Invalid/late observation stored with qualityErrors; excluded from rule,
          }
        "403": { description: Missing ingestion role or disabled membership }
        "404": { description: Source missing/disabled }
        "409":
          {
            description: EVENT_ID_CONFLICT or assigned officer unavailable; transaction retained safely or rolled back for retry,
          }
    get:
      description: Current assigned environment_officer only. Up to 200 recent observations with raw/normalized, units, timestamps, labels, quality/errors, gap and cooldown flags.
      responses:
        "200": { description: Observation items }
        "403": { description: Missing officer role }
        "404": { description: Source outside current scope }
  /api/g02/sources:
    get:
      description: Assigned environment_officer sources and active illustrative rule. No sensor/admin implicit read.
      responses:
        "200": { description: Source items, rule and packRevisionId }
        "403": { description: Missing officer role }
  /api/g02/episodes:
    get:
      description: Assigned officer only. Episode state and shared case status are separate; environmental recovery never auto-closes a case.
      responses:
        "200":
          {
            description: Up to 100 visible episodes with case ID/code,
            rule,
            condition times and current case status,
          }
        "403": { description: Missing officer role }
  /api/g02/episodes/{id}/lineage:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Assigned officer traces episode to exact rule snapshot, pack revision/checksum, case, valid measurement window and ingestion duplicate/conflict attempts. Invalid/late records remain in source quality history.
      responses:
        "200": { description: episode, observations and attempts }
        "403": { description: Missing officer role }
        "404": { description: Episode outside current case scope }
  /api/g02/cases:
    get:
      description: Shared case list/query/pagination and bucket semantics, scoped to G02 and current assigned environment_officer.
      responses:
        "200": { description: items, total, page, pageSize }
        "403": { description: Missing officer role }
  /api/g02/cases/{id}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Shared case projection, pinned versions, timeline and synchronization diagnostics; current G02 permission required.
      responses:
        "200": { description: item, timeline, synchronization }
        "403": { description: Missing officer role }
        "404": { description: Outside current case scope or wrong pack }
  /api/g02/cases/{id}/actions:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      description: Shared command executor. verify allows confirm or dismiss (reason); repair allows save_work or resolve (measures/result/reason plus clean evidence). Revision mandatory. Reasons >=5 chars; resolve never inferred from declining measurements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [action, revision],
                properties:
                  {
                    action: { enum: [confirm, dismiss, save_work, resolve] },
                    revision: { type: integer, minimum: 1 },
                    reason: { type: string, minLength: 5 },
                    measures: { type: string, minLength: 5 },
                    result: { type: string, minLength: 5 },
                  },
              }
      responses:
        "200": { description: Updated shared case }
        "202": { description: Command queued for automatic recovery }
        "400": { description: Invalid fields or missing reason }
        "403": { description: Role/step/person forbidden }
        "404": { description: Outside case scope }
        "409":
          { description: Stale revision, evidence required or engine mismatch }
  /api/g02/reports:
    get:
      description: Shared open/overdue/completed totals and drill-down scope, filtered to G02 and current officer.
      responses:
        "200": { description: open, overdue, completed, total and generatedAt }
        "403": { description: Missing officer role }
  /api/g02/cases/{id}/evidence:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Shared evidence metadata for authorized G02 case.
      responses:
        "200": { description: items and canUpload }
        "403": { description: Missing officer role }
        "404": { description: Outside case scope }
    post:
      description: Same binary upload headers/limits/idempotency/quarantine/scan as G01. Only the assigned officer in repair can upload; current membership and case scope checked.
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: header,
            name: X-File-Name,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Quarantined evidence }
        "200": { description: Idempotent replay }
        "403": { description: Forbidden officer/step }
        "404": { description: Outside scope }
        "413": { description: File exceeds 10 MiB }
  /api/g02/cases/{id}/evidence/{evidenceId}/download:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: evidenceId,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Shared authenticated download with clean-status, checksum and current G02 case permission; no public object URL.
      responses:
        "200": { description: Original clean bytes with attachment headers }
        "403": { description: Officer membership missing/revoked }
        "404": { description: Outside scope }
        "409": { description: File not clean or integrity failed }
  /api/g03/cases:
    get:
      description: Shared list/search/bucket/pagination with current safety role AND explicit case ACL AND participation relation. Unauthorized callers see zero items/counts. Pack-filtered; no cross-prefix G01/G02 access.
      responses:
        "200":
          { description: items, total, page, pageSize within current G03 scope }
        "403": { description: Membership disabled }
    post:
      description: safety_reporter creates a neutral simulated case. Initial ACL includes reporter and assigned safety coordinator. Same pack/reporter/key replay still checks current ACL. Same report schema and Idempotency-Key UUID as G01.
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Report" }
      responses:
        "201":
          {
            description: Shared case linked to real workflow and pinned safety pack,
          }
        "200": { description: Authorized idempotent replay }
        "202": { description: Durable command pending synchronization }
        "403": { description: Missing safety_reporter role }
        "404": { description: Replay case no longer in current ACL }
        "409": { description: Same key used with different content }
  /api/g03/cases/{id}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Shared projection/timeline/synchronization; G03 current-role, explicit ACL and case relation checked. Access decision journaled without body/query content.
      responses:
        "200": { description: Authorized case, timeline and synchronization }
        "404": { description: Missing or outside current G03 scope }
  /api/g03/cases/{id}/actions:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      description: Same G01 step/revision/action schema through shared engine executor, with safety roles/ACL. Only named safety staff assignment; no group editor. Assigned repairer cannot self-approve. Assignment updates participants ACL; submit requires clean evidence for current task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action, revision] }
      responses:
        "200": { description: Updated shared case }
        "202": { description: Command pending automatic recovery }
        "400":
          {
            description: Invalid action/fields/self-approval assignment or unsupported group,
          }
        "403": { description: Current case reader lacks action permission }
        "404": { description: Outside case scope }
        "409":
          { description: Stale revision, evidence missing or mapping conflict }
  /api/g03/reports:
    get:
      description: Shared open/overdue/completed counts filtered by G03 safety role, explicit ACL and participation; no implicit admin access.
      responses:
        "200":
          {
            description: Counts within current scope,
            zero for unauthorized users,
          }
  /api/g03/notifications:
    get:
      description: Recipient-linked case notifications re-filtered by CURRENT case permission. Neutral message/code only; no title or body. ACL revocation hides old notifications.
      responses:
        "200":
          {
            description: Up to 100 scoped notifications; unauthorized callers see empty items,
          }
  /api/g03/cases/{id}/access-log:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Safety officer with access to this exact case only. Actor UUID, operation/method, initial allowed decision, final HTTP status (nullable on interruption) and time; no content/search/filename/token.
      responses:
        "200": { description: Up to 200 journal entries for this case }
        "403":
          { description: Caller can read the case but lacks safety audit role }
        "404": { description: Case outside current scope }
  /api/g03/cases/{id}/evidence:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Shared metadata with explicit G03 case ACL/current role.
      responses:
        "200": { description: items and canUpload }
        "404": { description: Outside case scope }
    post:
      description: Same binary headers/10 MiB/idempotency/quarantine/scan as G01. Safety reporter at report/supplement or assigned safety repairer only; current G03 ACL required.
      parameters:
        - {
            in: header,
            name: Idempotency-Key,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: header,
            name: X-File-Name,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Quarantined file }
        "200": { description: Authorized idempotent replay }
        "403": { description: Reader lacks upload permission at current step }
        "404": { description: Outside G03 scope }
        "413": { description: File too large }
  /api/g03/cases/{id}/evidence/{evidenceId}/download:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: evidenceId,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      description: Shared clean-file download/checksum with current explicit G03 permission rechecked after storage read. Knowing both IDs grants no access; no public object URL.
      responses:
        "200": { description: Original clean attachment bytes }
        "403": { description: Membership revoked }
        "404": { description: Outside case scope or wrong file }
        "409": { description: File not clean or integrity failed }
  /api/g02/catalog:
    get:
      description: Shared catalog for the assigned officer UI; active G02 version and no manual-create permission.
      responses:
        "200":
          { description: Rooms/assets/staff and versions with canCreate=false }
        "403": { description: Missing environment role }
  /api/g03/catalog:
    get:
      description: Safety role only. Shared room/asset catalog and eligible safety staff mapped to supported actions; no unrestricted team assignment. Current role decides canCreate/canAudit.
      responses:
        "200":
          {
            description: Catalog with canCreate/canAudit,
            staff and active safety version,
          }
        "403": { description: Missing safety role }
components:
  responses:
    CaseResult:
      description: Persisted case with server-computed available actions
      content:
        application/json:
          schema:
            type: object
            properties:
              item: { $ref: "#/components/schemas/Case" }
  schemas:
    Revision: { type: integer, minimum: 1 }
    CaseStatus:
      {
        type: string,
        enum:
          [
            verification,
            supplement,
            assignment,
            assigned,
            in_progress,
            acceptance,
            closed,
          ],
      }
    Report:
      type: object
      additionalProperties: false
      required: [title, roomId, description]
      properties:
        title: { type: string, minLength: 5, maxLength: 160 }
        roomId: { type: string, minLength: 1, maxLength: 40 }
        assetId: { type: [string, "null"], minLength: 1, maxLength: 60 }
        description: { type: string, minLength: 10, maxLength: 4000 }
    Evidence:
      type: object
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        filename: { type: string }
        mime: { enum: [image/png, image/jpeg, application/pdf, text/plain] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        uploadedBy: { type: string, format: uuid }
        step: { type: string }
        taskId: { type: [string, "null"] }
        policyVersion: { type: string }
        packRevisionId: { type: [string, "null"], format: uuid }
        packageVersion: { type: string }
        scanStatus: { enum: [pending, clean, rejected, error] }
        scanVersion: { type: [string, "null"] }
        scanMessage: { type: [string, "null"] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        scannedAt: { type: [string, "null"], format: date-time }
    Case:
      type: object
      properties:
        id: { type: string, format: uuid }
        packId: { enum: [g01, g02, g03] }
        code: { type: string, example: G01-000001 }
        title: { type: string }
        roomId: { type: string }
        assetId: { type: [string, "null"] }
        description: { type: string }
        reporterId: { type: string, format: uuid }
        coordinatorId: { type: string, format: uuid }
        technicianId: { type: [string, "null"], format: uuid }
        teamId: { type: [string, "null"] }
        approverId: { type: [string, "null"], format: uuid }
        dueAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/CaseStatus" }
        syncStatus: { enum: [pending, ready, needs_reconciliation] }
        revision: { $ref: "#/components/schemas/Revision" }
        processId: { type: [string, "null"] }
        definitionId: { type: string }
        taskId: { type: [string, "null"] }
        taskKey: { type: [string, "null"] }
        packRevisionId: { type: [string, "null"], format: uuid }
        packageVersion: { type: string }
        schemaVersion: { type: string }
        workflowVersion: { type: string }
        evidencePolicyVersion: { type: string }
        evidencePolicy:
          {
            type: object,
            description: Immutable policy snapshot; submit requires at least one clean repair file for the current task,
          }
        measures: { type: [string, "null"] }
        result: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        decisionBy: { type: [string, "null"], format: uuid }
        actions:
          {
            type: array,
            items:
              {
                enum:
                  [
                    accept,
                    return_info,
                    resubmit,
                    assign,
                    receive,
                    save_work,
                    submit,
                    return_work,
                    approve,
                    confirm,
                    dismiss,
                    resolve,
                  ],
              },
          }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

name: sirocco-schoolops
services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:01ea903aa65deb58eb49d6e09d859ecff63a6bb7d61feca55f2abad71d08f72a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run pnpm demo:init first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run pnpm demo:init first}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run pnpm demo:init first}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?Run pnpm demo:init first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [core]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      ["./infra/generated/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [core]
  flowable:
    image: flowable/flowable-rest:7.2.0@sha256:bcb895b12a95c7a11c07daef9a66c7c7e021038963b0877ee1f01d43059694ee
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USERID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core]
  api:
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        {
          SOURCE_REVISION: "${SIROCCO_SOURCE_REVISION:-unknown}",
          APP_VERSION: "${SIROCCO_APP_VERSION:-dev}",
        }
    environment:
      PORT: "3000"
      APP_SOURCE_REVISION: ${SIROCCO_SOURCE_REVISION:-unknown}
      DATABASE_URL: postgresql://schoolops:${APP_DB_PASSWORD}@postgres:5432/schoolops
      OIDC_ISSUER: http://localhost:8180/realms/sirocco
      OIDC_JWKS_URL: http://keycloak:8080/realms/sirocco/protocol/openid-connect/certs
      OIDC_AUDIENCE: schoolops-api
      FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      BPMN_PATH: /app/packs/foundation/task.bpmn20.xml
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run pnpm demo:init first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run pnpm demo:init first}
      CLAMAV_HOST: clamav
    volumes: ["./packs:/app/packs:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      flowable: { condition: service_started }
      workflow-guard: { condition: service_completed_successfully }
      seaweedfs: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 30s
    networks: [core]
  workflow-guard:
    image: postgres:17.11-alpine3.23@sha256:01ea903aa65deb58eb49d6e09d859ecff63a6bb7d61feca55f2abad71d08f72a
    entrypoint: [/bin/sh, /guard.sh]
    environment:
      PGHOST: postgres
      PGUSER: flowable
      PGDATABASE: flowable
      PGPASSWORD: ${FLOWABLE_DB_PASSWORD}
    volumes: ["./infra/flowable/business-key-guard.sh:/guard.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      flowable: { condition: service_started }
    networks: [core]
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      [
        server,
        -ip=seaweedfs,
        -ip.bind=0.0.0.0,
        -dir=/data,
        -volume.max=64,
        -master.volumeSizeLimitMB=64,
        -volume.preStopSeconds=1,
        -filer,
        -s3,
        -s3.config=/etc/seaweedfs/s3.json,
      ]
    volumes:
      - seaweed-data:/data
      - ./infra/generated/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [core]
  clamav:
    image: clamav/clamav:1.5.4@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck:
      test: [CMD, clamdscan, --ping, "1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    networks: [core]
  worker:
    build: *api-build
    command: [node, apps/api/dist/worker.js]
    environment:
      DATABASE_URL: postgresql://schoolops:${APP_DB_PASSWORD}@postgres:5432/schoolops
      FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CLAMAV_HOST: clamav
    depends_on:
      api: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, apps/api/dist/worker-health.js]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [core]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        {
          SOURCE_REVISION: "${SIROCCO_SOURCE_REVISION:-unknown}",
          APP_VERSION: "${SIROCCO_APP_VERSION:-dev}",
        }
    networks: [core]
  gateway:
    image: apache/apisix:3.19.0-ubuntu@sha256:bb4958b943949b3543353481eff1333e10b3323c6095dd0af4406de2b8cf738e
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports: ["127.0.0.1:8088:9080"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - /usr/local/openresty/bin/resty
        - -I
        - /usr/local/apisix/deps/share/lua/5.1
        - -e
        - 'local http=require("resty.http").new(); local r,e=http:request_uri("http://127.0.0.1:9080/api/health/ready"); if not r or r.status ~= 200 then os.exit(1) end'
      interval: 10s
      timeout: 8s
      retries: 20
    networks: [core]
networks:
  core:
volumes:
  postgres-data:
  seaweed-data:
  clamav-data:

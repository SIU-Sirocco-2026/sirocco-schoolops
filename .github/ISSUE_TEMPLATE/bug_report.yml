name: Báo lỗi
description: Mô tả lỗi có thể tái hiện và kết quả mong muốn.
body:
  - type: textarea
    id: problem
    attributes:
      label: Lỗi và kết quả mong muốn
      description: Điều gì đang sai và hành vi đúng cần là gì?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cách tái hiện
      description: Ghi vai trò, thao tác và thông báo lỗi; không gửi mật khẩu hoặc token.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Phiên bản và môi trường
      description: Commit/nhánh, hệ điều hành, trình duyệt và tình trạng dịch vụ liên quan.
  - type: dropdown
    id: category
    attributes:
      label: Loại lỗi
      options:
        - Quyền
        - Dữ liệu
        - Workflow
        - Giao diện hoặc khả dụng
        - Cài đặt
        - Mạng hoặc môi trường
  - type: dropdown
    id: severity
    attributes:
      label: Mức nghiêm trọng đề xuất
      options:
        - Chưa phân loại
        - Blocker — chặn thử hoặc có lộ quyền/mất dữ liệu
        - Major — tác vụ chính sai, còn cách tiếp tục an toàn
        - Minor — bất tiện nhưng kết quả vẫn đúng
  - type: textarea
    id: session
    attributes:
      label: Lượt thử và kết quả thử lại
      description: Mã người thử, thành viên đội hay người dùng mục tiêu, môi trường chung, thời gian task, mức trợ giúp và Issue/commit sửa. Không gửi thông tin cá nhân hoặc secret.
